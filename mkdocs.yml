site_name: ingv-shakemap
site_description: "Async Python client for INGV earthquakes and ShakeMap grids: FDSN events, grid.xml parsing, ground shaking (PGA, PGV, MMI) at any point"
site_url: https://agentengineering.it/ingv-shakemap/
repo_url: https://github.com/agent-engineering-studio/ingv-shakemap
repo_name: agent-engineering-studio/ingv-shakemap
edit_uri: edit/main/docs/
copyright: "Code Apache-2.0. Earthquake data and ShakeMaps © INGV (terremoti.ingv.it data under CC BY 4.0)."

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  make_images.py

nav:
  - Home: index.md
  - API reference:
      - Client: api/client.md
      - ShakeMap grid: api/grid.md
      - ShakeMap products: api/products.md
      - Events (FDSN): api/events.md
      - Errors: api/errors.md
  - Changelog: changelog.md
  - Contributing: contributing.md

validation:
  links:
    not_found: info
    unrecognized_links: info
